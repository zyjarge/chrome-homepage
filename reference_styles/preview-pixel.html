<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>像素风 · 新标签页预览</title>
<style>
:root{
  --kimi-font-sans: system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --kimi-font-mono: ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --kimi-color-text-primary:#1a1a1a;
  --kimi-color-text-secondary:#575757;
  --kimi-color-text-tertiary:#8a8a8a;
  --kimi-color-text-quaternary:#b3b3b3;
}
html,body{margin:0;padding:0;}
body{background:#efeff2;min-height:100vh;}
</style>
</head>
<body>
<div class="px-root">
<style>
.px-root{
  --px-ink:#1c1c2e; --px-bg:#f4f0e4;
  font-family:var(--kimi-font-sans,sans-serif);
  position:relative; overflow:hidden; padding:28px; border-radius:24px;
  background:
    linear-gradient(rgba(28,28,46,.05) 2px, transparent 2px),
    linear-gradient(90deg, rgba(28,28,46,.05) 2px, transparent 2px),
    radial-gradient(600px 300px at 80% 0%, rgba(255,210,90,.25), transparent 60%),
    var(--px-bg);
  background-size:16px 16px, 16px 16px, auto, auto;
}
.px-root button{font:inherit;}
.px-root *{box-sizing:border-box;}
.px-scan{position:absolute; inset:0; pointer-events:none; opacity:.5;
  background:repeating-linear-gradient(0deg, rgba(28,28,46,.04) 0 2px, transparent 2px 4px);}

.px-wrap{position:relative; display:grid; grid-template-columns:290px 1fr; gap:22px; align-items:start;}

/* ===== 8-bit block ===== */
.px8{
  --n:8px;
  background:#fffdf4;
  clip-path:polygon(0 var(--n), var(--n) var(--n), var(--n) 0, calc(100% - var(--n)) 0, calc(100% - var(--n)) var(--n), 100% var(--n), 100% calc(100% - var(--n)), calc(100% - var(--n)) calc(100% - var(--n)), calc(100% - var(--n)) 100%, var(--n) 100%, var(--n) calc(100% - var(--n)), 0 calc(100% - var(--n)));
  box-shadow:0 6px 0 var(--px-ink);
  transition:transform .1s steps(2), box-shadow .1s steps(2), filter .15s;
}
.px8:hover{filter:brightness(1.03);}
.px8.press{animation:pxPress .3s steps(3);}
@keyframes pxPress{
  0%{transform:translate(0,0)} 30%{transform:translate(2px,4px); box-shadow:0 2px 0 var(--px-ink)}
  60%{transform:translate(-1px,1px)} 100%{transform:translate(0,0)}}
.px8.blink{animation:pxBlink 1.2s steps(2) infinite;}
@keyframes pxBlink{50%{opacity:.25}}

/* pixel text deco */
.px-title{font-family:var(--kimi-font-mono,monospace); font-weight:500;}

/* ===== sidebar ===== */
.side{padding:24px 20px; display:flex; flex-direction:column; gap:16px;}
.side .lbl{font-family:var(--kimi-font-mono,monospace); font-size:11px; letter-spacing:.18em; color:#6a6a80; text-transform:uppercase;}
.px-clock{font-family:var(--kimi-font-mono,monospace); font-size:48px; font-weight:500; line-height:1.1;
  color:var(--px-ink); text-shadow:3px 3px 0 #ffd25a;
  font-variant-numeric:tabular-nums;}
.px-clock small{font-size:20px; color:#6a6a80; text-shadow:none;}
.px-date{font-size:13px; color:#6a6a80;}
.px-stats{display:flex; gap:10px; font-family:var(--kimi-font-mono,monospace); font-size:10.5px; color:#6a6a80; letter-spacing:.12em;}
.px-search{display:flex; align-items:center; gap:8px; padding:12px 14px; cursor:text; font-size:13px; color:#6a6a80;
  background:#fff; border:4px solid var(--px-ink); box-shadow:4px 4px 0 var(--px-ink);}
.px-search .g{margin-left:auto; font-family:var(--kimi-font-mono,monospace); font-size:10px; font-weight:500;
  color:#fff; background:var(--px-ink); padding:3px 8px;}
.px-btns{display:flex; flex-wrap:wrap; gap:10px;}
.px-btn{padding:7px 12px; cursor:pointer; font-size:12px; color:var(--px-ink); background:#ffd25a;
  border:3px solid var(--px-ink); box-shadow:3px 3px 0 var(--px-ink);
  transition:transform .08s steps(2), box-shadow .08s steps(2);}
.px-btn:nth-child(2n){background:#8fd0ff;}
.px-btn:nth-child(3n){background:#9be89b;}
.px-btn:hover{transform:translate(-1px,-2px); box-shadow:4px 5px 0 var(--px-ink);}
.px-btn:active{transform:translate(3px,3px); box-shadow:0 0 0 var(--px-ink);}
.px-hint{font-size:11px; color:#6a6a80; font-family:var(--kimi-font-mono,monospace);}
.px-themes{display:flex; align-items:center; gap:12px; font-family:var(--kimi-font-mono,monospace); font-size:10px; letter-spacing:.14em; color:#6a6a80;}
.px-dot{width:16px; height:16px; cursor:pointer; border:3px solid var(--px-ink); box-shadow:2px 2px 0 var(--px-ink);
  transition:transform .08s steps(2);}
.px-dot:hover{transform:scale(1.3);}
.px-heart{color:#ff5a6e;}

/* ===== groups ===== */
.groups{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:20px;}
.gcard{padding:18px 16px; display:flex; flex-direction:column; gap:14px;}
.ghead{display:flex; align-items:center; gap:8px;}
.gchip{width:14px; height:14px; border:3px solid var(--px-ink); image-rendering:pixelated;}
.gtitle{font-size:14px; font-weight:500; color:var(--px-ink);}
.gcount{font-family:var(--kimi-font-mono,monospace); font-size:10px; color:#fff; background:#6a6a80; padding:2px 7px;}
.gadd{margin-left:auto; width:24px; height:24px; cursor:pointer; font-size:14px; line-height:1; color:#fff;
  background:var(--px-ink); border:none; box-shadow:3px 3px 0 #6a6a80;
  transition:transform .1s steps(2), box-shadow .1s steps(2);}
.gadd:hover{transform:translate(-1px,-1px); box-shadow:4px 4px 0 #6a6a80;}
.gadd:active{transform:translate(2px,2px); box-shadow:0 0 0 #6a6a80;}
.gtiles{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.gtile{display:flex; flex-direction:column; align-items:center; gap:8px; padding:12px 4px 10px; cursor:pointer;
  background:#fff; border:3px solid var(--px-ink); box-shadow:4px 4px 0 rgba(28,28,46,.85);
  transition:transform .08s steps(2), box-shadow .08s steps(2);}
.gtile:hover{transform:translate(-1px,-2px); box-shadow:5px 6px 0 rgba(28,28,46,.85);}
.gtile:active{transform:translate(3px,3px); box-shadow:0 0 0 rgba(28,28,46,.85);}
.gico{width:36px; height:36px; display:flex; align-items:center; justify-content:center;
  font-family:var(--kimi-font-mono,monospace); font-size:16px; font-weight:500; color:#fff;
  border:3px solid var(--px-ink); image-rendering:pixelated;
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.25), inset 4px 4px 0 rgba(255,255,255,.35);}
.gname{font-size:11px; color:#6a6a80; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
</style>

<div class="px-scan"></div>

<div class="px-wrap">
  <div class="side px8">
    <div class="lbl">local time · hangzhou <span class="px-heart blink">♥</span></div>
    <div class="px-clock" id="xclock">17:06<small>:57</small></div>
    <div class="px-date" id="xdate">2026年9月8日 星期二</div>
    <div class="px-stats"><span>43 SITES</span><span>08 GROUPS</span><span>BROWSE</span></div>
    <div class="px-search" data-x>› 输入关键词，直接回车搜索…<span class="g">G</span></div>
    <div class="px-btns">
      <button class="px-btn" data-x>✎ 编辑</button>
      <button class="px-btn" data-x>纸·海蓝</button>
      <button class="px-btn" data-x>⬇ 导出</button>
      <button class="px-btn" data-x>⬆ 导入</button>
      <button class="px-btn" data-x>⬆ 导入配置</button>
      <button class="px-btn" data-x>↺ 恢复默认</button>
    </div>
    <div class="px-hint">提示 · INSERT COIN。点击有像素级震动反馈。</div>
    <div class="px-themes">
      <span class="px-dot" style="background:#3a3630" data-x></span>
      <span class="px-dot" style="background:#f6f1e5" data-x></span>
      <span class="px-dot" style="background:#8fb8e8" data-x></span>
      <span class="px-dot" style="background:#e8735a" data-x></span>
      <span>INK·PAPER·COBALT·STAMP</span>
    </div>
  </div>
  <div class="groups" id="xgroups"></div>
</div>

<script>
const PAL=[['#ff6b6b','#d64545'],['#4d96ff','#2f6fd0'],['#39c26d','#229b50'],['#b06ee8','#8b4cc4'],['#ff9f43','#e07f1f'],['#38b6c9','#2596a8'],['#ff6fa5','#d14a82'],['#c9d438','#a3ad1f']];
const GROUPS=[
 {t:'AI',c:'9 ITEMS',d:'#4d96ff',sites:['ChatGPT','Minimax','OpenCode','Kimi AI','Gemini','DeepSeek','豆包','Skill 商店','The Agent']},
 {t:'娱乐 / 社交',c:'6 ITEMS',d:'#ff6fa5',sites:['GitHub','Bilibili','YouTube','Twitter','抖音','Telegram']},
 {t:'学习 / 资讯',c:'4 ITEMS',d:'#39c26d',sites:['知乎','掘金','MDN','Macked']},
 {t:'内网服务',c:'6 ITEMS',d:'#ff9f43',sites:['LLM Monitor','Node Export','MCPHUB','OpenMeta','DSH','Hermes']},
 {t:'招聘信息',c:'4 ITEMS',d:'#ff6b6b',sites:['Boss直聘','猎聘','招聘网','脉脉']},
 {t:'网络',c:'6 ITEMS',d:'#b06ee8',sites:['良心云','Nerwo','ESXI','iStoreos','iKuai','Redmi Router']},
 {t:'工作',c:'6 ITEMS',d:'#38b6c9',sites:['Vercel','Figma','Gmail','Google Calendar','网易邮箱','Google Tasks']},
 {t:'个人社媒',c:'2 ITEMS',d:'#c9d438',sites:['张勇-大数据','张勇-大数据']}
];
const hash=s=>{let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))>>>0;return h;};
document.getElementById('xgroups').innerHTML=GROUPS.map(g=>`
 <div class="gcard px8">
  <div class="ghead">
    <span class="gchip" style="background:${g.d}"></span>
    <span class="gtitle px-title">${g.t}</span>
    <span class="gcount">${g.c}</span>
    <button class="gadd" data-x>+</button>
  </div>
  <div class="gtiles">${g.sites.map(s=>{
    const c=PAL[hash(s)%PAL.length];
    return `<div class="gtile" data-x><div class="gico" style="background:linear-gradient(160deg,${c[0]} 60%,${c[1]})">${[...s][0].toUpperCase()}</div><div class="gname">${s}</div></div>`;
  }).join('')}</div>
 </div>`).join('');

function press(el){el.classList.remove('press');void el.offsetWidth;el.classList.add('press');}
document.querySelector('.px-root').addEventListener('click',e=>{
  const t=e.target.closest('[data-x]'); if(t) press(t);
});
function tick(){
  const n=new Date(),p=x=>String(x).padStart(2,'0');
  document.getElementById('xclock').innerHTML=`${p(n.getHours())}:${p(n.getMinutes())}<small>:${p(n.getSeconds())}</small>`;
  document.getElementById('xdate').textContent=`${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日 星期${'日一二三四五六'[n.getDay()]}`;
}
tick(); setInterval(tick,1000);
</script>
</div></body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="icon" href="data:,"/>
<title>Glass New Tab — Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#F2EFE7;
  --paper-2:#EAE6DA;
  --surface:#FFFFFF;
  --ink:#0F1A2E;
  --muted:#6B7288;
  --line:#DDD8CB;
  --line-strong:#CFC8B8;
  --cobalt:#1A66FF;
  --cobalt-hover:#0F4ED9;
  --stamp:#FF3D30;
  --stamp-bg:#FFF0EE;
  --grid:rgba(15,26,46,.06);
  --radius:16px;
  --radius-sm:12px;
  --shadow: 8px 8px 0 rgba(15,26,46,.08);
  --shadow-hover: 10px 10px 0 rgba(15,26,46,.10);
}
html,body{height:100%}
body{
  font-family:Inter,system-ui,-apple-system,sans-serif;
  color:var(--ink);
  background:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
  background-size: 32px 32px, 32px 32px, 100% 100%;
  min-height:100vh;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
::selection{background:var(--ink);color:#fff}
.app{
  max-width:1280px;margin:0 auto;
  display:grid;grid-template-columns:360px 1fr;
  gap:32px;padding:28px 24px 48px;
  align-items:start;
}
.rail{
  position:sticky;top:28px;
  display:flex;flex-direction:column;gap:20px;
}
.brand{
  display:flex;align-items:center;gap:10px;
  font-family:"JetBrains Mono",monospace;
  font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--line);padding-bottom:14px;
}
.brand .mark{
  width:28px;height:28px;display:grid;place-items:center;
  background:var(--ink);color:#fff;border-radius:8px;font-size:1rem;letter-spacing:0
}
.brand strong{color:var(--ink);font-weight:500;letter-spacing:.14em}
.time-block{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:22px 20px 18px;
  box-shadow:var(--shadow);
}
.kicker{
  font-family:"JetBrains Mono",monospace;
  font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;gap:8px;margin-bottom:12px;
}
.kicker i{width:28px;height:1px;background:var(--line-strong);display:inline-block}
#clock{
  font-family:"Space Grotesk",sans-serif;
  font-size:3.4rem;font-weight:700;letter-spacing:-.04em;line-height:.9;
  color:var(--ink);
}
#clock span{font-weight:500;color:var(--muted);font-size:1.6rem;vertical-align:baseline;margin-left:4px}
#date{
  margin-top:8px;
  font-family:"JetBrains Mono",monospace;font-size:.78rem;color:var(--muted);letter-spacing:.02em;
}
.stats{
  margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);
  display:flex;gap:14px;
  font-family:"JetBrains Mono",monospace;font-size:.7rem;color:var(--muted);
}
.stats b{color:var(--ink);font-weight:500}
.cmd{
  display:flex;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--ink);
  border-radius:999px;padding:12px 14px 12px 16px;
  box-shadow:var(--shadow);
  transition:border-color .2s, box-shadow .2s;
}
.cmd:focus-within{box-shadow:6px 6px 0 var(--ink);border-color:var(--ink)}
.cmd .prompt{
  font-family:"JetBrains Mono",monospace;color:var(--cobalt);font-weight:500;font-size:1rem;line-height:1;
}
.cmd input{
  flex:1;border:none;outline:none;background:transparent;
  font-family:Inter,sans-serif;font-size:.92rem;color:var(--ink);
}
.cmd input::placeholder{color:#9AA0B0}
.cmd kbd{
  font-family:"JetBrains Mono",monospace;font-size:.68rem;
  background:var(--ink);color:#fff;padding:5px 8px;border-radius:99px;line-height:1;
}
.cmd-submit{
  appearance:none;border:none;
  font-family:"JetBrains Mono",monospace;font-size:.68rem;
  background:var(--ink);color:#fff;padding:5px 8px;border-radius:99px;line-height:1;
  cursor:pointer;flex-shrink:0;transition:background .15s;
}
.cmd-submit:hover{background:var(--cobalt)}
.rail-actions{
  display:flex;flex-wrap:wrap;gap:8px;
}
.btn{
  appearance:none;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:9px 14px;
  font-family:"JetBrains Mono",monospace;font-size:.74rem;letter-spacing:.02em;font-weight:500;
  color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  transition:transform .15s, box-shadow .15s, background .15s, border-color .15s, color .15s;
  user-select:none;
}
.btn:hover{transform:translateY(-1px);border-color:var(--ink);box-shadow:4px 4px 0 rgba(15,26,46,.08)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff;box-shadow:4px 4px 0 rgba(26,102,255,.22)}
.btn-primary:hover{background:var(--cobalt-hover);border-color:var(--cobalt-hover);box-shadow:6px 6px 0 rgba(26,102,255,.28)}
.btn-stamp{background:var(--stamp);border-color:var(--stamp);color:#fff}
.btn-stamp:hover{background:#E6352B}
.btn-ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.select{
  padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-family:"JetBrains Mono",monospace;font-size:.74rem;color:var(--ink);outline:none;cursor:pointer;
}
.select:focus{border-color:var(--ink)}
.edit-bar{
  display:flex;flex-wrap:wrap;gap:8px;
  padding:12px;background:var(--stamp-bg);border:1px dashed #FFB4AF;border-radius:14px;
  animation:stampIn .25s ease;
}
@keyframes stampIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.hint-mini{
  font-family:"JetBrains Mono",monospace;font-size:.68rem;color:var(--muted);line-height:1.4;
}
.hint-mini b{color:var(--ink);font-weight:500}
.main-wrap{min-width:0}
.catalog-head{
  display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px;padding:0 4px;
}
.catalog-head h1{
  font-family:"Space Grotesk",sans-serif;font-size:1.05rem;font-weight:700;letter-spacing:-.02em;
  display:flex;align-items:center;gap:10px;
}
.catalog-head h1 em{
  font-style:normal;font-family:"JetBrains Mono",monospace;font-size:.68rem;letter-spacing:.14em;
  color:var(--muted);font-weight:400;border:1px solid var(--line);padding:3px 7px;border-radius:99px;background:rgba(255,255,255,.7)
}
.catalog-head p{font-family:"JetBrains Mono",monospace;font-size:.68rem;color:var(--muted)}
#groups-container{display:grid;grid-template-columns:1fr;gap:22px;align-items:start}
@media (min-width:1080px){
  #groups-container{grid-template-columns:repeat(2, minmax(0,1fr));}
}
@media (min-width:1680px){
  .app{max-width:1600px}
  #groups-container{grid-template-columns:repeat(3, minmax(0,1fr));}
}
.group{
  position:relative;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);
  padding:0;overflow:visible;
  transition:box-shadow .2s, transform .2s;
}
.group:hover{box-shadow:var(--shadow-hover);transform:translateY(-1px)}
.group::before{
  content:"";position:absolute;left:14px;top:12px;bottom:12px;width:0;
  border-left:1px dashed var(--line-strong);opacity:.9;pointer-events:none;
}
.group.drag-over{outline:2px dashed var(--cobalt);outline-offset:2px}
.group-tab{
  position:absolute;left:18px;top:-10px;
  display:inline-flex;align-items:center;gap:8px;
  background:#FFFEFB;color:var(--ink);border:1px solid var(--line-strong);
  font-family:"JetBrains Mono",monospace;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;
  padding:6px 10px 6px 8px;border-radius:8px 8px 8px 2px;
  box-shadow:2px 2px 0 rgba(15,26,46,.06);
}
.group-tab .dot{width:7px;height:7px;border-radius:50%;background:var(--cobalt);box-shadow:0 0 0 3px rgba(26,102,255,.12);flex-shrink:0}
.group-tab .count{
  background:#F2EFE7;border:1px solid var(--line);
  color:var(--muted);padding:1px 6px;border-radius:99px;font-size:.66rem;letter-spacing:.08em
}
.group-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:26px 18px 14px 36px;
  border-bottom:1px solid var(--line);
}
.group-title{
  display:flex;align-items:baseline;gap:10px;min-width:0;
}
.group-title h2{
  font-family:"Space Grotesk",sans-serif;font-size:1.02rem;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.group-title .meta{
  font-family:"JetBrains Mono",monospace;font-size:.68rem;color:var(--muted);letter-spacing:.04em;white-space:nowrap
}
.group-actions{display:flex;gap:6px;flex-shrink:0}
.icon-btn{
  width:30px;height:30px;display:grid;place-items:center;
  border:1px solid var(--line);background:var(--surface);border-radius:50%;
  cursor:pointer;font-size:.9rem;transition:all .15s;
}
.icon-btn:hover{border-color:var(--ink);transform:translateY(-1px)}
.shortcut-grid{
  display:grid;grid-template-columns:repeat(auto-fill, minmax(102px, 1fr));gap:10px;
  padding:32px 14px 14px 30px;
}
.shortcut-card{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:14px 6px 10px;text-decoration:none;color:var(--ink);
  background:#F9F8F5;border:1px solid var(--line);border-radius:14px;
  transition:transform .18s cubic-bezier(.25,.46,.45,.94), background .18s, border-color .18s, box-shadow .18s;
  overflow:hidden;min-width:0;
}
.shortcut-card:hover{
  background:#fff;border-color:var(--ink);transform:translateY(-3px);
  box-shadow:6px 6px 0 rgba(15,26,46,.08);
}
.shortcut-card.dragging{opacity:.4;transform:scale(.98)}
.shortcut-card .icon{
  width:44px;height:44px;display:grid;place-items:center;
  background:#fff;border:1px solid var(--line);border-radius:12px;
  font-size:1.25rem;overflow:hidden;flex-shrink:0;position:relative;
}
.shortcut-card .icon img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;border-radius:11px;opacity:0;transition:opacity .15s}
.shortcut-card .icon img.loaded{opacity:1}
.shortcut-card .icon .fallback-letter{width:100%;height:100%;display:grid;place-items:center;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:1rem;background:var(--paper-2);color:var(--ink);border:1px solid var(--line);border-radius:10px;line-height:1}
.shortcut-card .name{
  font-size:.78rem;font-weight:600;letter-spacing:-.01em;text-align:center;line-height:1.25;
  max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;
}
.shortcut-card .domain{
  font-family:"JetBrains Mono",monospace;font-size:.62rem;color:var(--muted);letter-spacing:.02em;
  max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;
  opacity:0;transform:translateY(4px);transition:all .18s;pointer-events:none;
}
.shortcut-card:hover .domain{opacity:1;transform:translateY(0)}
.card-actions{
  position:absolute;top:6px;right:6px;display:flex;gap:4px;
  opacity:0;transform:translateY(-4px);transition:all .15s;pointer-events:none;
}
body.edit-mode .card-actions{opacity:1;transform:translateY(0);pointer-events:auto}
.card-actions .mini{
  width:22px;height:22px;display:grid;place-items:center;
  background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:50%;
  font-size:.7rem;cursor:pointer;
}
.card-actions .mini.danger{background:#fff;color:var(--stamp);border-color:var(--stamp)}
.card-actions .mini:hover{transform:scale(1.08)}
.shortcut-card.edit-wiggle{animation:wiggle .28s ease-in-out infinite alternate}
@keyframes wiggle{from{transform:rotate(-.5deg)}to{transform:rotate(.5deg)}}
.shortcut-card.edit-wiggle:hover{animation:none;transform:translateY(-3px)}
.empty-tip{
  grid-column:1/-1;text-align:center;padding:22px 12px;
  font-family:"JetBrains Mono",monospace;font-size:.74rem;color:var(--muted);
  border:1px dashed var(--line);border-radius:12px;background:rgba(255,255,255,.6)
}
.empty-tip b{color:var(--ink);font-weight:500}
.modal-overlay{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(15,26,46,.42);backdrop-filter:blur(6px);
  opacity:0;visibility:hidden;transition:opacity .22s, visibility .22s;z-index:1000;
}
.modal-overlay.active{opacity:1;visibility:visible}
.modal{
  width:100%;max-width:480px;max-height:90vh;overflow:auto;
  background:var(--surface);border:1px solid var(--ink);border-radius:20px;box-shadow:12px 12px 0 var(--ink);
  padding:24px;transform:translateY(10px) scale(.98);transition:transform .22s;
}
.modal-overlay.active .modal{transform:translateY(0) scale(1)}
.modal h2{font-family:"Space Grotesk",sans-serif;font-size:1.2rem;letter-spacing:-.02em;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.modal h2 i{font-style:normal;width:8px;height:8px;background:var(--cobalt);border-radius:50%;display:inline-block}
.form-group{margin-bottom:14px}
.form-group label{display:block;margin-bottom:6px;font-family:"JetBrains Mono",monospace;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.form-group input,.form-group select{
  width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#F9F8F5;
  color:var(--ink);font-size:.92rem;outline:none;transition:border-color .15s, box-shadow .15s;
}
.form-group input:focus,.form-group select:focus{border-color:var(--cobalt);box-shadow:0 0 0 3px rgba(26,102,255,.12);background:#fff}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.icon-preview{
  width:56px;height:56px;border-radius:14px;display:grid;place-items:center;
  font-size:1.6rem;background:#F9F8F5;border:1px solid var(--line);margin-bottom:12px;overflow:hidden;
}
.icon-preview img{width:100%;height:100%;object-fit:cover}
.hint{font-size:.72rem;color:var(--muted);margin-top:6px}
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(12px);
  padding:11px 16px;border-radius:99px;font-family:"JetBrains Mono",monospace;font-size:.76rem;font-weight:500;
  background:var(--ink);color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.18);
  opacity:0;visibility:hidden;transition:all .22s;z-index:1100;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;
}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.theme-dots{display:flex;gap:6px;align-items:center}
.theme-dots span{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.08);display:inline-block}
@media (max-width:980px){
  .app{grid-template-columns:1fr;gap:20px;padding:16px 14px 40px}
  .rail{position:static}
  #clock{font-size:2.6rem}
  .shortcut-grid{grid-template-columns:repeat(4, minmax(0,1fr));padding-left:14px}
  .group::before{display:none}
  .group-head{padding-left:18px}
  .shortcut-card .domain{opacity:1;transform:none}
}
@media (max-width:560px){
  .shortcut-grid{grid-template-columns:repeat(3, minmax(0,1fr))}
  .form-row{grid-template-columns:1fr}
  .catalog-head{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
  .reveal{opacity:1 !important;transform:none !important}
  .shortcut-card.edit-wiggle{animation:none !important}
}
.reveal{opacity:0;transform:translateY(8px);animation:reveal .5s ease forwards}
@keyframes reveal{to{opacity:1;transform:translateY(0)}}

/* ================= 整体风格主题 ================= */
/* —— 黏土 Clay：暖陶底色 + 软陶慢回弹材质 —— */
body[data-theme="clay"]{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(900px 500px at 12% 0%,rgba(255,214,190,.6),transparent 55%),radial-gradient(800px 500px at 92% 8%,rgba(190,214,255,.55),transparent 55%),radial-gradient(700px 500px at 55% 115%,rgba(214,236,205,.55),transparent 60%),linear-gradient(180deg,#fbf3ec,#f3ebe2);background-attachment:fixed}
body[data-theme="clay"]::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:multiply;background-image:radial-gradient(rgba(120,90,70,.06) 1px,transparent 1.4px);background-size:7px 7px}
body[data-theme="clay"] .app{position:relative;z-index:1}
body[data-theme="clay"] .brand{color:#a08772;border-bottom-color:rgba(110,80,60,.18)}
body[data-theme="clay"] .brand .mark{background:#5d4a3a;border-radius:46% 54% 52% 48%/52% 48% 54% 46%}
body[data-theme="clay"] .brand strong{color:#5d4a3a}
body[data-theme="clay"] .time-block,body[data-theme="clay"] .group,body[data-theme="clay"] .modal{background:linear-gradient(155deg,#fffaf4,#f4e8db);border:none;border-radius:28px;box-shadow:0 20px 34px -16px rgba(110,80,60,.45),0 4px 8px -2px rgba(110,80,60,.18),inset 0 3px 6px rgba(255,255,255,.85),inset 0 -12px 22px -10px rgba(110,80,60,.35)}
body[data-theme="clay"] .group:hover{box-shadow:0 28px 42px -16px rgba(110,80,60,.5),0 4px 8px -2px rgba(110,80,60,.18),inset 0 3px 6px rgba(255,255,255,.85),inset 0 -12px 22px -10px rgba(110,80,60,.35)}
body[data-theme="clay"] .group::before{display:none}
body[data-theme="clay"] .kicker,body[data-theme="clay"] .stats,body[data-theme="clay"] #date,body[data-theme="clay"] .hint-mini,body[data-theme="clay"] .catalog-head p,body[data-theme="clay"] .catalog-head h1 em,body[data-theme="clay"] .group-title .meta{color:#a08772}
body[data-theme="clay"] .kicker i{background:rgba(110,80,60,.25)}
body[data-theme="clay"] .stats{border-top-color:rgba(110,80,60,.25)}
body[data-theme="clay"] .stats b,body[data-theme="clay"] .hint-mini b,body[data-theme="clay"] .empty-tip b{color:#5d4a3a}
body[data-theme="clay"] #clock{color:#5d4a3a;text-shadow:0 2px 0 rgba(255,255,255,.7),0 -1px 1px rgba(110,80,60,.2)}
body[data-theme="clay"] #clock span{color:#a08772}
body[data-theme="clay"] .cmd{border:none;background:linear-gradient(160deg,#fff,#f1e5d8);box-shadow:inset 0 4px 10px rgba(110,80,60,.28),inset 0 -2px 4px rgba(255,255,255,.8)}
body[data-theme="clay"] .cmd:focus-within{box-shadow:inset 0 5px 12px rgba(110,80,60,.38),inset 0 -2px 4px rgba(255,255,255,.8)}
body[data-theme="clay"] .cmd .prompt{color:#7a6150}
body[data-theme="clay"] .cmd input{color:#5d4a3a}
body[data-theme="clay"] .cmd input::placeholder{color:#b39a83}
body[data-theme="clay"] .cmd kbd,body[data-theme="clay"] .cmd-submit{background:linear-gradient(160deg,#8fa8c9,#6e88ab);color:#fff;box-shadow:0 3px 6px -2px rgba(90,110,140,.6),inset 0 2px 3px rgba(255,255,255,.4)}
body[data-theme="clay"] .cmd-submit:hover{background:linear-gradient(160deg,#7e97ba,#5d779a)}
body[data-theme="clay"] .btn,body[data-theme="clay"] .select{border:none;color:#5d4a3a;background:linear-gradient(160deg,#fff8f0,#ecdccf);box-shadow:0 5px 10px -4px rgba(110,80,60,.5),inset 0 2px 3px rgba(255,255,255,.9),inset 0 -3px 6px -2px rgba(110,80,60,.3)}
body[data-theme="clay"] .btn{transition:transform .4s cubic-bezier(.28,1.5,.42,1)}
body[data-theme="clay"] .btn:hover{transform:scale(1.06) translateY(-2px);box-shadow:0 8px 14px -4px rgba(110,80,60,.5),inset 0 2px 3px rgba(255,255,255,.9),inset 0 -3px 6px -2px rgba(110,80,60,.3)}
body[data-theme="clay"] .btn:active{transform:scale(.94)}
body[data-theme="clay"] .btn-primary{background:linear-gradient(160deg,#8fa8c9,#6e88ab);color:#fff}
body[data-theme="clay"] .btn-stamp{background:linear-gradient(160deg,#f2a08c,#d4705a);color:#fff}
body[data-theme="clay"] .btn-ghost{background:transparent;box-shadow:none;border:1px dashed rgba(110,80,60,.4)}

<script>
const STORAGE_KEY='glass-new-tab-data-v1',THEME_KEY='glass-new-tab-theme';
const DEFAULT_DATA={groups:[{id:'g-work',name:'工作 / 常用工具',emoji:'💼'},{id:'g-ent',name:'娱乐 / 社交',emoji:'🎮'},{id:'g-learn',name:'学习 / 资讯',emoji:'📚'}],shortcuts:[{id:'s-1',name:'GitHub',url:'https://github.com',icon:'🐙',groupId:'g-work'},{id:'s-2',name:'Vercel',url:'https://vercel.com',icon:'▲',groupId:'g-work'},{id:'s-3',name:'Figma',url:'https://figma.com',icon:'🎨',groupId:'g-work'},{id:'s-4',name:'ChatGPT',url:'https://chat.openai.com',icon:'🤖',groupId:'g-work'},{id:'s-5',name:'Bilibili',url:'https://bilibili.com',icon:'📺',groupId:'g-ent'},{id:'s-6',name:'YouTube',url:'https://youtube.com',icon:'▶️',groupId:'g-ent'},{id:'s-7',name:'Twitter',url:'https://twitter.com',icon:'🐦',groupId:'g-ent'},{id:'s-8',name:'知乎',url:'https://zhihu.com',icon:'💡',groupId:'g-learn'},{id:'s-9',name:'掘金',url:'https://juejin.cn',icon:'📖',groupId:'g-learn'},{id:'s-10',name:'MDN',url:'https://developer.mozilla.org',icon:'🌐',groupId:'g-learn'}]};
let state={groups:[],shortcuts:[]},editingLinkId=null,editMode=false;
const els={
  clock:document.getElementById('clock'),
  date:document.getElementById('date'),
  stats:document.getElementById('stats'),
  container:document.getElementById('groups-container'),
  catalogCount:document.getElementById('catalog-count'),
  searchInput:document.getElementById('search-input'),
  toast:document.getElementById('toast'),
  linkModal:document.getElementById('link-modal'),
  linkModalTitle:document.getElementById('link-modal-title'),
  linkName:document.getElementById('link-name'),
  linkUrl:document.getElementById('link-url'),
  linkIcon:document.getElementById('link-icon'),
  linkGroup:document.getElementById('link-group'),
  iconPreview:document.getElementById('icon-preview'),
  btnAddLink:document.getElementById('btn-add-link'),
  btnLinkCancel:document.getElementById('btn-link-cancel'),
  btnLinkSave:document.getElementById('btn-link-save'),
  groupsModal:document.getElementById('groups-modal'),
  groupsList:document.getElementById('groups-list'),
  newGroupName:document.getElementById('new-group-name'),
  newGroupEmoji:document.getElementById('new-group-emoji'),
  btnManageGroups:document.getElementById('btn-manage-groups'),
  btnGroupsClose:document.getElementById('btn-groups-close'),
  btnCreateGroup:document.getElementById('btn-create-group'),
  btnReset:document.getElementById('btn-reset'),
  themeSelect:document.getElementById('theme-select'),
  btnEditMode:document.getElementById('btn-edit-mode'),
  editBar:document.getElementById('edit-bar'),
  btnExport:document.getElementById('btn-export'),
  btnImport:document.getElementById('btn-import'),
  importFile:document.getElementById('import-file'),
  btnAlwaysImport:document.getElementById('btn-always-import'),
  btnAlwaysReset:document.getElementById('btn-always-reset')
};
function generateId(p){return `${p}-${Date.now()}-${Math.random().toString(36).slice(2,7)}`}
function loadData(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed=JSON.parse(raw);
      if(parsed&&Array.isArray(parsed.groups)&&Array.isArray(parsed.shortcuts)){
        if(parsed.groups.length===0){ throw new Error('empty groups'); }
        state=parsed;
        let changed=false;
        state.shortcuts.forEach(s=>{ if(!state.groups.find(g=>g.id===s.groupId)){ s.groupId=state.groups[0].id; changed=true; }});
        if(changed) saveData();
        return;
      }
    }
  }catch(e){console.warn('loadData fallback',e)}
  state=JSON.parse(JSON.stringify(DEFAULT_DATA));saveData();
}
function saveData(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}}
function debounce(fn,wait){let t=null;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),wait)}}
const STYLE_VALUES=['archive','clay','jelly','pixel','plush','sketch'];
function applyTheme(theme){
  // 旧版配色值（default/ocean/warm/morandi）统一迁移为 archive
  if(!STYLE_VALUES.includes(theme)) theme='archive';
  document.body.dataset.theme=theme;
  try{localStorage.setItem(THEME_KEY,theme)}catch(e){}
}
function hashHue(s){let h=0;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))>>>0;return h%8}
function loadTheme(){try{return localStorage.getItem(THEME_KEY)||'default'}catch{return 'default'}}
function toggleEditMode(){
  editMode=!editMode;document.body.classList.toggle('edit-mode',editMode);
  els.btnEditMode.textContent=editMode?'✓ 完成':'✎ 编辑';
  els.btnEditMode.classList.toggle('btn-primary',editMode);
  els.btnEditMode.classList.toggle('btn-stamp',editMode);
  els.editBar.style.display=editMode?'block':'none';
  renderGroups();
  showToast(editMode?'已进入编辑模式 — 可拖拽、编辑':'已退出编辑模式','info');
}
let titleAbortController=null;
async function fetchSiteTitle(url){
  const target=normalizeUrl(url);if(!target||els.linkName.value.trim()) return;
  if(titleAbortController) titleAbortController.abort();
  titleAbortController=new AbortController();
  try{
    const res=await fetch(`https://api.microlink.io?url=${encodeURIComponent(target)}`,{signal:titleAbortController.signal});
    if(!res.ok) return;const data=await res.json();const title=data?.data?.title?.trim();
    if(title&&!els.linkName.value.trim()) els.linkName.value=title;
  }catch(e){if(e.name!=='AbortError') console.warn(e)}
}
const debouncedFetchTitle=debounce(fetchSiteTitle,800);
function normalizeUrl(url){if(!url) return '';url=url.trim();if(!/^https?:\/\//i.test(url)&&!/^ftps?:\/\//i.test(url)) url='https://'+url;return url}
function getDomain(url){try{return new URL(normalizeUrl(url)).hostname}catch{return ''}}
function renderIcon(icon,url,name){
  icon=(icon||'').trim();if(icon) return `<span>${escapeHtml(icon)}</span>`;
  const domain=getDomain(url);
  const letter=((name||domain||'🌐').trim().charAt(0).toUpperCase()||'🌐');
  const safe=escapeHtml(letter);
  if(domain) return `<span class="fallback-letter">${safe}</span><img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64" alt="" loading="lazy" onload="this.classList.add('loaded')" onerror="this.remove()">`;
  return `<span>${safe}</span>`;
}
function showToast(msg,type='info'){
  els.toast.textContent=msg;
  els.toast.style.background=type==='error'?'#FF3D30':type==='success'?'#0F8A5F':'#0F1A2E';
  els.toast.classList.add('show');setTimeout(()=>els.toast.classList.remove('show'),2200);
}
function updateClock(){
  const now=new Date();const pad=n=>String(n).padStart(2,'0');
  els.clock.innerHTML=`${pad(now.getHours())}:${pad(now.getMinutes())}<span>:${pad(now.getSeconds())}</span>`;
  els.date.textContent=now.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
  const total=state.shortcuts.length,groups=state.groups.length;
  els.stats.innerHTML=`<span><b>${String(total).padStart(2,'0')}</b> SITES</span><span>·</span><span><b>${String(groups).padStart(2,'0')}</b> GROUPS</span><span>·</span><span>${editMode?'EDITING':'BROWSE'}</span>`;
  if(els.catalogCount) els.catalogCount.textContent=`${String(total).padStart(2,'0')} SITES · ${String(groups).padStart(2,'0')} GROUPS`;
}
function renderGroups(){
  els.container.innerHTML='';
  if(state.groups.length===0){
    els.container.innerHTML=`<div class="group" style="padding:28px;text-align:center"><div style="font-family:Space Grotesk,sans-serif;font-weight:700;margin-bottom:8px">空索引 — 尚未建立任何分组</div><div style="font-family:JetBrains Mono,monospace;font-size:.74rem;color:var(--muted);margin-bottom:14px">本地数据为空或已损坏，可一键恢复默认示例</div><button class="btn btn-primary" onclick="resetData()">↺ 恢复默认索引</button> <button class="btn" onclick="localStorage.clear();location.reload()">清空缓存重载</button><div style="margin-top:10px;font-size:.68rem;color:var(--muted)">或访问 <code>?reset=1</code> 自动重置</div></div>`;
    return;
  }
  const idxMap={0:'W',1:'E',2:'L'};
  state.groups.forEach((group,index)=>{
    const groupShortcuts=state.shortcuts.filter(s=>s.groupId===group.id);
    const section=document.createElement('section');
    section.className='group';
    section.dataset.groupId=group.id;
    section.style.animationDelay=`${index*70}ms`;
    section.classList.add('reveal');
    const code=`${idxMap[index%3]||'G'}-${String(groupShortcuts.length).padStart(2,'0')}`;
    const tab=document.createElement('div');
    tab.className='group-tab';
    tab.innerHTML=`<span class="dot"></span> ${escapeHtml(group.emoji||'📁')} ${escapeHtml(group.name)} <span class="count">${code} · ${groupShortcuts.length} 项</span><button class="icon-btn" title="在此分组添加" data-action="add-empty" data-group="${group.id}" style="margin-left:8px;width:22px;height:22px;font-size:.75rem;background:var(--ink);border-color:var(--ink);color:#fff">＋</button>`;
    const grid=document.createElement('div');
    grid.className='shortcut-grid';
    if(groupShortcuts.length===0){
      grid.innerHTML=`<div class="empty-tip">空抽屉 — <button class="btn btn-primary" data-action="add-empty" data-group="${group.id}" style="padding:4px 10px;font-size:.72rem">＋ 添加快捷</button> <button class="btn" data-action="trigger-import" style="padding:4px 10px;font-size:.72rem">⬆ 导入</button></div>`;
    }else{
      groupShortcuts.forEach((sc,i)=>{
        const card=document.createElement('a');
        card.className='shortcut-card'+(editMode?' edit-wiggle':'');
        card.href=normalizeUrl(sc.url);card.target='_blank';card.rel='noopener noreferrer';
        card.title=sc.name;card.draggable=editMode;card.dataset.id=sc.id;
        card.style.animationDelay=`${i*24}ms`;
        const domain=getDomain(sc.url);
        card.innerHTML=`
          <div class="icon" data-hue="${hashHue(sc.name||sc.url)}">${renderIcon(sc.icon, sc.url, sc.name)}</div>
          <div class="name">${escapeHtml(sc.name)}</div>
          <div class="domain">${escapeHtml(domain)}</div>
          <div class="card-actions">
            <button class="mini" title="编辑" data-action="edit" data-id="${sc.id}">✎</button>
            <button class="mini danger" title="删除" data-action="delete" data-id="${sc.id}">✕</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }
    section.appendChild(tab);section.appendChild(grid);
    els.container.appendChild(section);
  });
}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function populateGroupSelect(selectedId){
  els.linkGroup.innerHTML='';
  state.groups.forEach(g=>{
    const o=document.createElement('option');o.value=g.id;o.textContent=`${g.emoji||'📁'} ${g.name}`;if(g.id===selectedId) o.selected=true;els.linkGroup.appendChild(o);
  });
}
function openLinkModal(mode='add',shortcut=null,groupId=null){
  editingLinkId=mode==='edit'&&shortcut?shortcut.id:null;
  els.linkModalTitle.textContent=mode==='edit'?'编辑快捷':'添加快捷';
  els.linkName.value=shortcut?shortcut.name:'';els.linkUrl.value=shortcut?shortcut.url:'';els.linkIcon.value=shortcut?shortcut.icon:'';
  populateGroupSelect(groupId||(shortcut?shortcut.groupId:state.groups[0]?.id));
  updateIconPreview();els.linkModal.classList.add('active');els.linkName.focus();
}
function closeLinkModal(){els.linkModal.classList.remove('active');editingLinkId=null}
function updateIconPreview(){els.iconPreview.innerHTML=renderIcon(els.linkIcon.value, els.linkUrl.value, els.linkName.value||'🌐')}
function saveLink(){
  const name=els.linkName.value.trim();let url=els.linkUrl.value.trim();const icon=els.linkIcon.value.trim();const groupId=els.linkGroup.value;
  if(!name) return showToast('请输入名称','error');
  if(!url) return showToast('请输入链接','error');
  if(!groupId||!state.groups.find(g=>g.id===groupId)) return showToast('请选择分组','error');
  url=normalizeUrl(url);
  if(editingLinkId){
    const idx=state.shortcuts.findIndex(s=>s.id===editingLinkId);
    if(idx!==-1){state.shortcuts[idx]={...state.shortcuts[idx],name,url,icon,groupId};showToast('已更新','success')}
  }else{state.shortcuts.push({id:generateId('s'),name,url,icon,groupId});showToast('已添加','success')}
  saveData();renderGroups();closeLinkModal();
}
function deleteLink(id){if(!confirm('确定删除该快捷？'))return;state.shortcuts=state.shortcuts.filter(s=>s.id!==id);saveData();renderGroups();showToast('已删除','success')}
function renderGroupsManagement(){
  els.groupsList.innerHTML='';
  if(state.groups.length===0){els.groupsList.innerHTML='<div class="empty-tip">暂无分组</div>';return}
  state.groups.forEach(g=>{
    const count=state.shortcuts.filter(s=>s.groupId===g.id).length;
    const row=document.createElement('div');
    row.style.cssText='display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;background:#F9F8F5;border:1px solid var(--line)';
    row.innerHTML=`
      <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0;">
        <span style="font-size:1.1rem">${g.emoji||'📁'}</span>
        <input type="text" value="${escapeHtml(g.name)}" data-field="name" data-group="${g.id}" style="flex:1;min-width:0;background:transparent;border:none;font-size:.92rem;outline:none;border-bottom:1px dashed var(--line)"/>
        <input type="text" value="${g.emoji||''}" data-field="emoji" data-group="${g.id}" style="width:44px;text-align:center;background:transparent;border:none;font-size:1rem;outline:none;border-bottom:1px dashed var(--line)" maxlength="2"/>
        <span style="font-family:JetBrains Mono,monospace;font-size:.68rem;color:var(--muted)">${String(count).padStart(2,'0')}</span>
      </div>
      <button class="btn" style="margin-left:8px;padding:6px 10px" data-action="delete-group" data-group="${g.id}">删除</button>
    `;
    els.groupsList.appendChild(row);
  });
}
function openGroupsModal(){renderGroupsManagement();els.groupsModal.classList.add('active')}
function closeGroupsModal(){els.groupsModal.classList.remove('active')}
function createGroup(){
  const name=els.newGroupName.value.trim(),emoji=els.newGroupEmoji.value.trim();
  if(!name) return showToast('请输入分组名称','error');
  state.groups.push({id:generateId('g'),name,emoji});saveData();renderGroups();renderGroupsManagement();
  els.newGroupName.value='';els.newGroupEmoji.value='';showToast('已创建','success');
}
function updateGroup(id,field,value){const g=state.groups.find(x=>x.id===id);if(!g) return;g[field]=value;saveData();renderGroups()}
function deleteGroup(id){
  const count=state.shortcuts.filter(s=>s.groupId===id).length;
  if(!confirm(count>0?`该分组下还有 ${count} 个快捷，删除后一并移除？`:'确定删除该分组？')) return;
  state.groups=state.groups.filter(g=>g.id!==id);state.shortcuts=state.shortcuts.filter(s=>s.groupId!==id);
  saveData();renderGroups();renderGroupsManagement();showToast('已删除分组','success');
}
function resetData(){if(!confirm('恢复默认将覆盖所有自定义内容，确定？'))return;state=JSON.parse(JSON.stringify(DEFAULT_DATA));saveData();renderGroups();showToast('已恢复默认','success')}
function exportConfig(){
  const payload={version:1,exportedAt:new Date().toISOString(),theme:loadTheme(),groups:state.groups,shortcuts:state.shortcuts};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`archive-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);showToast('已导出','success');
}
function validateImportData(data){
  if(!data||typeof data!=='object') return '文件格式不正确';
  if(!Array.isArray(data.groups)||!Array.isArray(data.shortcuts)) return '缺少分组或快捷数据';
  for(const g of data.groups) if(!g||typeof g.id!=='string'||typeof g.name!=='string') return '分组格式错误';
  for(const s of data.shortcuts) if(!s||typeof s.id!=='string'||typeof s.name!=='string'||typeof s.url!=='string'||typeof s.groupId!=='string') return '快捷格式错误';
  return null;
}
function handleImportFile(file){
  if(!file) return;const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);const err=validateImportData(data);
      if(err) return showToast('导入失败：'+err,'error');
      if(!confirm('导入将覆盖现有全部数据，确定？')) return;
      const fallback=data.groups[0]?.id;
      data.shortcuts.forEach(s=>{if(!data.groups.find(g=>g.id===s.groupId)) s.groupId=fallback});
      state.groups=data.groups;state.shortcuts=data.shortcuts;saveData();
      if(typeof data.theme==='string'){applyTheme(data.theme);els.themeSelect.value=document.body.dataset.theme}
      renderGroups();showToast('已导入','success');
    }catch(e){showToast('不是有效的 JSON','error')}
  };reader.readAsText(file);
}
function handleSearch(e){if(e.key!=='Enter') return;const q=els.searchInput.value.trim();if(!q) return;window.open(`https://www.google.com/search?q=${encodeURIComponent(q)}`,'_blank','noopener,noreferrer');els.searchInput.value=''}
function bindEvents(){
  els.btnAddLink.addEventListener('click',()=>openLinkModal('add'));
  els.btnManageGroups.addEventListener('click',openGroupsModal);
  els.btnReset.addEventListener('click',resetData);
  els.btnEditMode.addEventListener('click',toggleEditMode);
  els.btnExport.addEventListener('click',exportConfig);
  els.btnImport.addEventListener('click',()=>els.importFile.click());
  if(els.btnAlwaysImport) els.btnAlwaysImport.addEventListener('click',()=>els.importFile.click());
  if(els.btnAlwaysReset) els.btnAlwaysReset.addEventListener('click',resetData);
  els.importFile.addEventListener('change',e=>{handleImportFile(e.target.files[0]);e.target.value=''});
  els.themeSelect.addEventListener('change',e=>{applyTheme(e.target.value);showToast('已切换风格','success')});
  els.btnLinkCancel.addEventListener('click',closeLinkModal);
  els.btnLinkSave.addEventListener('click',saveLink);
  els.linkIcon.addEventListener('input',updateIconPreview);
  els.linkUrl.addEventListener('input',()=>{updateIconPreview();debouncedFetchTitle(els.linkUrl.value)});
  els.linkUrl.addEventListener('blur',()=>fetchSiteTitle(els.linkUrl.value));
  els.btnGroupsClose.addEventListener('click',closeGroupsModal);
  els.btnCreateGroup.addEventListener('click',createGroup);
  els.groupsList.addEventListener('input',e=>{const t=e.target;if(!t.dataset.group) return;updateGroup(t.dataset.group,t.dataset.field,t.value.trim())});
  els.groupsList.addEventListener('click',e=>{const b=e.target.closest('[data-action="delete-group"]');if(b) deleteGroup(b.dataset.group)});
  els.container.addEventListener('click',e=>{
    const btn=e.target.closest('button, .shortcut-card');if(!btn) return;
    const action=btn.dataset.action;if(!action) return;
    if(action==='add-empty'){ openLinkModal('add',null,btn.dataset.group);return}
    if(action==='trigger-import'){ els.importFile.click();return}
    if(action==='add-to-group'){if(!editMode) return;openLinkModal('add',null,btn.dataset.group);return}
    const id=btn.dataset.id;
    if(action==='edit'){if(!editMode) return;e.preventDefault();e.stopPropagation();const sc=state.shortcuts.find(s=>s.id===id);if(sc) openLinkModal('edit',sc)}
    else if(action==='delete'){if(!editMode) return;e.preventDefault();e.stopPropagation();deleteLink(id)}
  });
  els.container.addEventListener('dragstart',e=>{
    const card=e.target.closest('.shortcut-card');if(!card||!editMode||e.target.closest('button')){e.preventDefault();return}
    e.dataTransfer.setData('text/plain',card.dataset.id);e.dataTransfer.effectAllowed='move';card.classList.add('dragging');
  });
  els.container.addEventListener('dragend',e=>{
    const card=e.target.closest('.shortcut-card');if(card) card.classList.remove('dragging');
    document.querySelectorAll('.group.drag-over').forEach(g=>g.classList.remove('drag-over'));
  });
  els.container.addEventListener('dragover',e=>{
    const g=e.target.closest('.group');if(!g) return;e.preventDefault();e.dataTransfer.dropEffect='move';
    document.querySelectorAll('.group.drag-over').forEach(x=>{if(x!==g) x.classList.remove('drag-over')});g.classList.add('drag-over');
  });
  els.container.addEventListener('dragleave',e=>{
    const g=e.target.closest('.group');if(!g) return;if(!g.contains(e.relatedTarget)) g.classList.remove('drag-over');
  });
  els.container.addEventListener('drop',e=>{
    const g=e.target.closest('.group');if(!g) return;e.preventDefault();g.classList.remove('drag-over');
    const id=e.dataTransfer.getData('text/plain'),target=g.dataset.groupId;if(!id||!target) return;
    const sc=state.shortcuts.find(s=>s.id===id);if(!sc||sc.groupId===target) return;
    sc.groupId=target;saveData();renderGroups();showToast('已移动','success');
  });
  els.searchInput.addEventListener('keydown',handleSearch);
  const searchSubmit=document.getElementById('search-submit');
  if(searchSubmit) searchSubmit.addEventListener('click',()=>handleSearch({key:'Enter'}));
  document.querySelectorAll('.modal-overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o) o.classList.remove('active')}));
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeLinkModal();closeGroupsModal()}});
}
function init(){
  const params=new URLSearchParams(location.search);
  if(params.has('reset') || params.has('clear')){
    localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(THEME_KEY);
    const url=new URL(location.href); url.searchParams.delete('reset'); url.searchParams.delete('clear');
    history.replaceState(null,'', url.pathname + (url.search ? url.search : '') + url.hash);
  }
  const theme=loadTheme();applyTheme(theme);els.themeSelect.value=document.body.dataset.theme;
  loadData();renderGroups();updateClock();setInterval(updateClock,1000);bindEvents();els.searchInput.focus();
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    document.querySelectorAll('.reveal').forEach(el=>{el.style.opacity='1';el.style.transform='none';el.style.animation='none'});
  }
  setTimeout(()=>{ document.querySelectorAll('.reveal').forEach(el=>{ if(getComputedStyle(el).opacity==='0'){ el.style.opacity='1'; el.style.transform='none'; }}); }, 900);
  if(state.shortcuts.length===0 && state.groups.length>0){
    showToast('当前无快捷方式，可点击 ✎ 编辑添加','info');
  }
}
init();
</script>
</body>
</html>

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩：HTML/CSS/JS 文本资源
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/html
        text/css
        text/plain
        application/javascript
        application/json
        image/svg+xml;

    # 静态资源协商缓存沿用默认 ETag/Last-Modified 即可
    location / {
        try_files $uri $uri/ =404;
    }
}
